<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wordle</title>
<link rel="manifest" href="manifest.json">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; overflow-x: hidden; }
  body {
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding: 12px 12px 24px;
    background: linear-gradient(135deg, #2a1f3c, #150d1f);
    font-family: 'Segoe UI', system-ui, sans-serif;
    color: #f3ecff;
    position: relative;
  }
  h1 {
    margin: 6px 0 10px;
    font-size: clamp(22px, 6vw, 32px);
    letter-spacing: 2px;
    color: #b967ff;
    text-shadow: 0 0 10px rgba(185,103,255,0.5);
  }
  #homeBtn {
    position: absolute;
    top: 12px;
    left: 12px;
    margin: 0;
    padding: 8px 14px;
    font-size: 14px;
    background: #2a1f3c;
    color: #b967ff;
    border: 2px solid #b967ff;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    border-radius: 6px;
  }
  #homeBtn:hover { background: #3a2a52; }
  #difficulty {
    display: flex;
    flex-wrap: wrap;
    gap: 10px 18px;
    margin-bottom: 10px;
    font-size: clamp(13px, 3.6vw, 15px);
    justify-content: center;
  }
  #difficulty label {
    display: flex;
    align-items: center;
    gap: 6px;
    cursor: pointer;
  }
  #status {
    font-size: clamp(15px, 4vw, 18px);
    font-weight: bold;
    margin: 4px 0 14px;
    min-height: 24px;
    text-align: center;
  }
  #grid {
    display: grid;
    gap: 6px;
    margin-bottom: 18px;
  }
  .row {
    display: grid;
    gap: 6px;
    grid-auto-flow: column;
  }
  .cell {
    width: clamp(38px, 11vw, 54px);
    height: clamp(38px, 11vw, 54px);
    border: 2px solid #4a3a63;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: clamp(18px, 5.5vw, 26px);
    font-weight: bold;
    text-transform: uppercase;
    background: #1f1730;
  }
  .cell.filled { border-color: #7a5da3; }
  .cell.correct { background: #4caf6b; border-color: #4caf6b; color: #fff; }
  .cell.present { background: #d4b83a; border-color: #d4b83a; color: #241a0d; }
  .cell.absent { background: #3a3245; border-color: #3a3245; color: #999; }

  #keyboard {
    display: flex;
    flex-direction: column;
    gap: 6px;
    max-width: 480px;
    width: 100%;
  }
  .kbrow { display: flex; gap: 5px; justify-content: center; }
  #keyboard button {
    flex: 1;
    max-width: 40px;
    padding: 12px 0;
    font-size: 14px;
    font-weight: bold;
    border: none;
    border-radius: 6px;
    background: #3a3245;
    color: #f3ecff;
    cursor: pointer;
  }
  #keyboard button.wide { max-width: 60px; font-size: 11px; }
  #keyboard button:hover { background: #4a3f5c; }
  #keyboard button.correct { background: #4caf6b; color: #fff; }
  #keyboard button.present { background: #d4b83a; color: #241a0d; }
  #keyboard button.absent { background: #241d2e; color: #666; }

  button.action {
    margin-top: 18px;
    padding: 10px 24px;
    font-size: 16px;
    border: none;
    border-radius: 6px;
    background: #b967ff;
    color: #150d1f;
    font-weight: bold;
    cursor: pointer;
  }
  button.action:hover { background: #ca8bff; }

  #addWordSection {
    margin-top: 20px;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
    justify-content: center;
    max-width: 460px;
  }
  #newWordInput {
    padding: 8px 12px;
    border-radius: 6px;
    border: 1px solid #b967ff88;
    background: #150d1f;
    color: #f3ecff;
    font-size: 14px;
    width: 180px;
  }
  #newWordDifficulty {
    padding: 8px 10px;
    border-radius: 6px;
    border: 1px solid #b967ff88;
    background: #150d1f;
    color: #f3ecff;
    font-size: 14px;
  }
  #addWordBtn {
    padding: 8px 16px;
    font-size: 14px;
    border: none;
    border-radius: 6px;
    background: #3a2a52;
    color: #f3ecff;
    cursor: pointer;
  }
  #addWordBtn:hover:not(:disabled) { background: #4a3568; }
  #addWordBtn:disabled { opacity: 0.5; cursor: default; }
  #addWordMessage {
    width: 100%;
    text-align: center;
    font-size: 13px;
    min-height: 18px;
    color: #d8b6ff;
  }
</style>
</head>
<body>
  <a id="homeBtn" href="../">🏠 Menu</a>
  <h1>🟩 Wordle</h1>

  <div id="difficulty">
    <label><input type="radio" name="diff" value="easy" checked> Easy (4 letters)</label>
    <label><input type="radio" name="diff" value="hard"> Hard (6 letters)</label>
  </div>

  <div id="status"></div>

  <div id="grid"></div>

  <div id="keyboard"></div>

  <button class="action" id="newGameBtn">New Word</button>

  <div id="addWordSection">
    <input id="newWordInput" type="text" placeholder="Add a word (shared)" maxlength="6">
    <select id="newWordDifficulty">
      <option value="easy">Easy (4 letters)</option>
      <option value="hard">Hard (6 letters)</option>
    </select>
    <button id="addWordBtn">Add</button>
    <div id="addWordMessage"></div>
  </div>

<script>
(function () {
  const DEFAULT_EASY = ['CAKE','LAMP','TREE','FISH','BIRD','STAR','MOON','RAIN','SNOW','WIND',
    'FIRE','GOLD','BLUE','PINK','GRAY','JUMP','GAME','BOOK','DESK','LAKE',
    'HILL','ROCK','SAND','LEAF','SEED','BEAR','WOLF','DUCK','FROG','GOAT',
    'MILK','SOUP','RICE','CORN','PEAR','PLUM','LIME','MINT','HERB','VASE',
    'DOOR','WALL','ROOF','GATE','YARD','PARK','ROAD','SHIP','BOAT','KITE',
    'BALL','DOLL','CARD','GIFT','CAMP','TENT','ROPE','BELL','DRUM','HORN',
    'FLAG','RING','SOCK','SHOE','COAT','VEST','BELT'];

  const DEFAULT_HARD = ['GALAXY','MODULE','WIZARD','PLANET','THREAD','BRIDGE','CASTLE','FOREST',
    'DRAGON','ISLAND','MARBLE','PUZZLE','SPIRAL','TUNNEL','GARDEN','MIRROR',
    'SHADOW','SILVER','SUNSET','TICKET','WINTER','SUMMER','SPRING','AUTUMN',
    'BASKET','BOTTLE','BUTTON','CAMERA','CANDLE','CIRCLE','COFFEE','COOKIE',
    'CRAYON','DESERT','ENGINE','FALCON','FLOWER','FOSSIL','GADGET','GALLON',
    'GENTLE','GOBLIN','GUITAR','HAMMER','HANDLE','HELMET','JACKET','KETTLE',
    'LADDER','MAGNET','MARKET','MEADOW','MELODY','MEMORY','MONKEY','MOTHER',
    'MUFFIN','MUSEUM','NATURE','NICKEL','NUMBER','ORANGE','ORIGIN','OYSTER',
    'PARROT','PENCIL','PICKLE','PILLOW','PIRATE','POCKET','POODLE','POTATO',
    'PRINCE','PUDDLE','RABBIT','RIBBON','ROCKET','SADDLE','SALMON','SCHOOL',
    'SHOWER','SPIDER','SQUARE','STREAM','STUDIO','TEMPLE','TICKLE','TOMATO',
    'TURTLE','VELVET','VIOLET','WALNUT','WINDOW','WOODEN','YELLOW'];

  const REST_BASE = 'https://snakes-db-default-rtdb.europe-west1.firebasedatabase.app';
  const KEY_ROWS = [
    ['Q','W','E','R','T','Y','U','I','O','P'],
    ['A','S','D','F','G','H','J','K','L'],
    ['ENTER','Z','X','C','V','B','N','M','BACK']
  ];

  let pools = { easy: [...DEFAULT_EASY], hard: [...DEFAULT_HARD] };
  let difficulty, wordLength, maxGuesses, target, guesses, currentGuess, gameOver;
  let keyStatus; // letter -> 'correct' | 'present' | 'absent'

  const gridEl = document.getElementById('grid');
  const statusEl = document.getElementById('status');
  const keyboardEl = document.getElementById('keyboard');
  const newGameBtn = document.getElementById('newGameBtn');
  const newWordInput = document.getElementById('newWordInput');
  const newWordDifficulty = document.getElementById('newWordDifficulty');
  const addWordBtn = document.getElementById('addWordBtn');
  const addWordMessage = document.getElementById('addWordMessage');

  function getDifficulty() {
    return document.querySelector('input[name="diff"]:checked').value;
  }

  async function loadCustomWords() {
    try {
      const [easyRes, hardRes] = await Promise.all([
        fetch(`${REST_BASE}/wordleWords/easy.json`),
        fetch(`${REST_BASE}/wordleWords/hard.json`)
      ]);
      const easyData = easyRes.ok ? await easyRes.json() : null;
      const hardData = hardRes.ok ? await hardRes.json() : null;
      pools.easy = [...new Set([...DEFAULT_EASY, ...(easyData ? Object.keys(easyData) : [])])];
      pools.hard = [...new Set([...DEFAULT_HARD, ...(hardData ? Object.keys(hardData) : [])])];
      console.log('[wordle] custom words loaded — easy:', pools.easy.length, 'hard:', pools.hard.length);
    } catch (err) {
      console.error('[wordle] failed to load custom words:', err);
    }
  }

  async function addCustomWord(rawWord, tier) {
    const word = rawWord.trim().toUpperCase();
    const expectedLength = tier === 'easy' ? 4 : 6;

    if (word.length !== expectedLength || !/^[A-Z]+$/.test(word)) {
      return { ok: false, message: `${tier === 'easy' ? 'Easy' : 'Hard'} words must be exactly ${expectedLength} letters, A-Z only.` };
    }
    if (pools[tier].includes(word)) {
      return { ok: false, message: `"${word}" is already in the ${tier} list.` };
    }

    try {
      const res = await fetch(`${REST_BASE}/wordleWords/${tier}/${word}.json`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(Date.now())
      });
      if (res.status === 401 || res.status === 403) {
        pools[tier] = [...new Set([...pools[tier], word])];
        return { ok: true, message: `"${word}" was already added by someone else — added to your list too!` };
      }
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      pools[tier] = [...new Set([...pools[tier], word])];
      return { ok: true, message: `"${word}" added to the ${tier} list! Everyone will see it in future games.` };
    } catch (err) {
      console.error('[wordle] failed to add word:', err);
      return { ok: false, message: "Couldn't add that word — check your connection." };
    }
  }

  function buildGrid() {
    gridEl.innerHTML = '';
    gridEl.style.gridTemplateRows = `repeat(${maxGuesses}, 1fr)`;
    for (let r = 0; r < maxGuesses; r++) {
      const row = document.createElement('div');
      row.className = 'row';
      row.style.gridTemplateColumns = `repeat(${wordLength}, 1fr)`;
      for (let c = 0; c < wordLength; c++) {
        const cell = document.createElement('div');
        cell.className = 'cell';
        cell.id = `cell-${r}-${c}`;
        row.appendChild(cell);
      }
      gridEl.appendChild(row);
    }
  }

  function buildKeyboard() {
    keyboardEl.innerHTML = '';
    KEY_ROWS.forEach(row => {
      const rowEl = document.createElement('div');
      rowEl.className = 'kbrow';
      row.forEach(key => {
        const btn = document.createElement('button');
        btn.textContent = key === 'BACK' ? '⌫' : key === 'ENTER' ? 'Enter' : key;
        btn.dataset.key = key;
        if (key === 'ENTER' || key === 'BACK') btn.classList.add('wide');
        btn.addEventListener('click', () => handleKey(key));
        rowEl.appendChild(btn);
      });
      keyboardEl.appendChild(rowEl);
    });
  }

  function newGame() {
    difficulty = getDifficulty();
    wordLength = difficulty === 'easy' ? 4 : 6;
    maxGuesses = wordLength + 1;
    const pool = pools[difficulty];
    target = pool[Math.floor(Math.random() * pool.length)];
    guesses = [];
    currentGuess = '';
    gameOver = false;
    keyStatus = {};
    buildGrid();
    buildKeyboard();
    statusEl.textContent = '';
    renderCurrentRow();
  }

  function renderCurrentRow() {
    const r = guesses.length;
    if (r >= maxGuesses) return;
    for (let c = 0; c < wordLength; c++) {
      const cell = document.getElementById(`cell-${r}-${c}`);
      const letter = currentGuess[c] || '';
      cell.textContent = letter;
      cell.classList.toggle('filled', !!letter);
    }
  }

  function scoreGuess(guess) {
    const result = Array(wordLength).fill('absent');
    const targetLetters = target.split('');
    const used = Array(wordLength).fill(false);

    // pass 1: exact matches
    for (let i = 0; i < wordLength; i++) {
      if (guess[i] === targetLetters[i]) {
        result[i] = 'correct';
        used[i] = true;
        targetLetters[i] = null;
      }
    }
    // pass 2: present-but-wrong-position, respecting remaining letter counts
    for (let i = 0; i < wordLength; i++) {
      if (result[i] === 'correct') continue;
      const idx = targetLetters.indexOf(guess[i]);
      if (idx !== -1) {
        result[i] = 'present';
        targetLetters[idx] = null;
      }
    }
    return result;
  }

  function updateKeyStatus(guess, result) {
    const rank = { absent: 0, present: 1, correct: 2 };
    guess.split('').forEach((letter, i) => {
      const current = keyStatus[letter];
      if (!current || rank[result[i]] > rank[current]) {
        keyStatus[letter] = result[i];
      }
    });
    document.querySelectorAll('#keyboard button').forEach(btn => {
      const status = keyStatus[btn.dataset.key];
      btn.classList.remove('correct', 'present', 'absent');
      if (status) btn.classList.add(status);
    });
  }

  function submitGuess() {
    if (gameOver) return;
    if (currentGuess.length !== wordLength) {
      statusEl.textContent = `Word must be ${wordLength} letters.`;
      return;
    }
    if (!pools[difficulty].includes(currentGuess)) {
      statusEl.textContent = "Not in the word list.";
      return;
    }

    const result = scoreGuess(currentGuess);
    const r = guesses.length;
    for (let c = 0; c < wordLength; c++) {
      const cell = document.getElementById(`cell-${r}-${c}`);
      cell.textContent = currentGuess[c];
      cell.classList.add(result[c]);
    }
    updateKeyStatus(currentGuess, result);
    guesses.push(currentGuess);

    if (currentGuess === target) {
      gameOver = true;
      statusEl.textContent = 'You got it! 🎉';
    } else if (guesses.length >= maxGuesses) {
      gameOver = true;
      statusEl.textContent = `Out of guesses! The word was ${target}.`;
    } else {
      statusEl.textContent = '';
    }
    currentGuess = '';
    if (!gameOver) renderCurrentRow();
  }

  function handleKey(key) {
    if (gameOver) return;
    if (key === 'ENTER') {
      submitGuess();
    } else if (key === 'BACK') {
      currentGuess = currentGuess.slice(0, -1);
      renderCurrentRow();
    } else if (currentGuess.length < wordLength) {
      currentGuess += key;
      renderCurrentRow();
    }
  }

  document.addEventListener('keydown', (e) => {
    const tag = document.activeElement && document.activeElement.tagName;
    if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
    if (e.key === 'Enter') { handleKey('ENTER'); return; }
    if (e.key === 'Backspace') { handleKey('BACK'); return; }
    const letter = e.key.toUpperCase();
    if (letter.length === 1 && letter >= 'A' && letter <= 'Z') handleKey(letter);
  });

  document.querySelectorAll('input[name="diff"]').forEach(r => {
    r.addEventListener('change', () => { r.blur(); newGame(); });
  });

  newGameBtn.addEventListener('click', newGame);

  addWordBtn.addEventListener('click', async () => {
    addWordBtn.disabled = true;
    addWordMessage.textContent = 'Adding…';
    const result = await addCustomWord(newWordInput.value, newWordDifficulty.value);
    addWordMessage.textContent = result.message;
    if (result.ok) newWordInput.value = '';
    addWordBtn.disabled = false;
  });

  newWordInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { e.preventDefault(); addWordBtn.click(); }
  });

  // test-only hook: safe to leave in production — reveals only today's local
  // game state, no server data, same trust model as snake's test hook
  window.__testGetTarget = () => target;

  newGame();
  loadCustomWords(); // background — available from the next New Word onward
})();
</script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(err => console.error('SW registration failed:', err));
    });
  }
</script>
</body>
</html>
