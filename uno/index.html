<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Uno</title>
<link rel="manifest" href="manifest.json">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; overflow-x: hidden; }
  body {
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding: 12px 12px 24px;
    background: linear-gradient(135deg, #241a3c, #12081f);
    font-family: 'Segoe UI', system-ui, sans-serif;
    color: #f0e8ff;
    position: relative;
  }
  h1 {
    margin: 6px 0 10px;
    font-size: clamp(22px, 6vw, 32px);
    letter-spacing: 2px;
    color: #ff4b5c;
    text-shadow: 0 0 10px rgba(255,75,92,0.5);
  }
  #homeBtn {
    position: absolute;
    top: 12px;
    left: 12px;
    margin: 0;
    padding: 8px 14px;
    font-size: 14px;
    background: #241a3c;
    color: #ff4b5c;
    border: 2px solid #ff4b5c;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    border-radius: 6px;
    z-index: 25;
  }
  #homeBtn:hover { background: #34274f; }
  #playerCountBar {
    display: flex;
    flex-wrap: wrap;
    gap: 10px 18px;
    margin-bottom: 10px;
    font-size: clamp(13px, 3.6vw, 15px);
    justify-content: center;
    position: relative;
    z-index: 25;
  }
  #playerCountBar label {
    display: flex;
    align-items: center;
    gap: 6px;
    cursor: pointer;
  }
  #status {
    font-size: clamp(15px, 4vw, 18px);
    font-weight: bold;
    margin: 4px 0 14px;
    min-height: 24px;
    text-align: center;
  }
  #table {
    display: flex;
    gap: 16px;
    align-items: center;
    justify-content: center;
    margin-bottom: 20px;
  }
  .card {
    width: clamp(50px, 15vw, 72px);
    height: clamp(76px, 22vw, 108px);
    border-radius: 10px;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 2px 6px rgba(0,0,0,0.4);
    flex-shrink: 0;
    color: #fff;
    font-weight: bold;
  }
  .card .oval {
    position: absolute;
    width: 78%;
    height: 55%;
    background: #fff;
    border-radius: 50%;
    transform: rotate(-20deg);
  }
  .card .symbol {
    position: relative;
    z-index: 1;
    font-size: clamp(18px, 5.5vw, 28px);
    font-weight: 900;
  }
  .card.red { background: #e53935; } .card.red .symbol { color: #e53935; }
  .card.yellow { background: #f4b400; } .card.yellow .symbol { color: #b8860b; }
  .card.green { background: #43a047; } .card.green .symbol { color: #2e7031; }
  .card.blue { background: #1e88e5; } .card.blue .symbol { color: #1e5c9e; }
  .card.black { background: #212121; }
  .card.black .oval { background: linear-gradient(135deg, #e53935, #f4b400, #43a047, #1e88e5); }
  .card.black .symbol { color: #212121; font-size: clamp(11px, 3.2vw, 15px); }
  .card.back {
    background: repeating-linear-gradient(45deg, #3a2a5c, #3a2a5c 6px, #2a1c48 6px, #2a1c48 12px);
    border: 2px solid #f0e8ff55;
  }
  .card.drawpile { cursor: pointer; }
  #discardWrap, #drawWrap { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  #discardWrap span, #drawWrap span { font-size: 12px; color: #c9b8ff; }

  #hand {
    display: flex;
    justify-content: center;
    min-height: clamp(90px, 25vw, 130px);
    margin-top: 10px;
    flex-wrap: wrap;
    gap: 2px;
  }
  #hand .card {
    cursor: pointer;
    margin: 0 -8px;
    transition: transform 0.12s ease;
  }
  #hand .card:hover { transform: translateY(-8px); }
  #hand .card.disabled { opacity: 0.45; cursor: default; }
  #hand .card.disabled:hover { transform: none; }

  button.action {
    margin-top: 14px;
    padding: 10px 24px;
    font-size: 16px;
    border: none;
    border-radius: 6px;
    background: #ff4b5c;
    color: #12081f;
    font-weight: bold;
    cursor: pointer;
  }
  button.action:hover { background: #ff7080; }
  button.action:disabled { opacity: 0.4; cursor: default; }

  #overlay {
    position: fixed;
    inset: 0;
    background: #12081fee;
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 18px;
    z-index: 20;
    text-align: center;
    padding: 20px;
  }
  #overlay.visible { display: flex; }
  #overlay h2 { color: #ff4b5c; font-size: clamp(20px, 6vw, 28px); margin: 0; }
  #overlay p { color: #c9b8ff; max-width: 320px; }

  #colorPicker {
    display: flex;
    gap: 12px;
  }
  #colorPicker button {
    width: 60px;
    height: 60px;
    border-radius: 50%;
    border: 3px solid #fff;
    cursor: pointer;
  }
  #colorPicker button.red { background: #e53935; }
  #colorPicker button.yellow { background: #f4b400; }
  #colorPicker button.green { background: #43a047; }
  #colorPicker button.blue { background: #1e88e5; }
</style>
</head>
<body>
  <a id="homeBtn" href="../">🏠 Menu</a>
  <h1>🎴 Uno</h1>

  <div id="playerCountBar">
    <label><input type="radio" name="playerCount" value="2" checked> 2 Players</label>
    <label><input type="radio" name="playerCount" value="3"> 3 Players</label>
    <label><input type="radio" name="playerCount" value="4"> 4 Players</label>
  </div>

  <div id="status"></div>

  <div id="table">
    <div id="drawWrap">
      <div class="card back drawpile" id="drawPile"></div>
      <span>Draw</span>
    </div>
    <div id="discardWrap">
      <div id="discardCard"></div>
      <span>Discard</span>
    </div>
  </div>

  <div id="hand"></div>

  <button class="action" id="endTurnBtn" style="display:none;">End Turn</button>
  <button class="action" id="newGameBtn">New Game</button>

  <div id="overlay">
    <h2 id="overlayTitle"></h2>
    <p id="overlaySubtitle"></p>
    <button class="action" id="overlayBtn">Ready</button>
  </div>

<script>
(function () {
  const COLORS = ['red', 'yellow', 'green', 'blue'];
  const SYMBOLS = { skip: '⊘', reverse: '↻', draw2: '+2', wild: 'W', wild4: '+4' };

  const statusEl = document.getElementById('status');
  const handEl = document.getElementById('hand');
  const discardCardEl = document.getElementById('discardCard');
  const drawPileEl = document.getElementById('drawPile');
  const endTurnBtn = document.getElementById('endTurnBtn');
  const newGameBtn = document.getElementById('newGameBtn');
  const overlay = document.getElementById('overlay');
  const overlayTitle = document.getElementById('overlayTitle');
  const overlaySubtitle = document.getElementById('overlaySubtitle');
  const overlayBtn = document.getElementById('overlayBtn');
  const playerCountRadios = document.querySelectorAll('input[name="playerCount"]');

  let players, deck, discardPile, currentPlayerIndex, direction, currentColor;
  let gameOver, winner, drawnCardIdx, pendingWildPlay;

  function getPlayerCount() {
    return +document.querySelector('input[name="playerCount"]:checked').value;
  }

  playerCountRadios.forEach(r => r.addEventListener('change', () => { r.blur(); newGame(); }));

  function buildDeck() {
    const d = [];
    for (const color of COLORS) {
      d.push({ color, type: 'number', value: 0 });
      for (let v = 1; v <= 9; v++) {
        d.push({ color, type: 'number', value: v });
        d.push({ color, type: 'number', value: v });
      }
      for (const type of ['skip', 'reverse', 'draw2']) {
        d.push({ color, type });
        d.push({ color, type });
      }
    }
    for (let i = 0; i < 4; i++) d.push({ color: 'black', type: 'wild' });
    for (let i = 0; i < 4; i++) d.push({ color: 'black', type: 'wild4' });
    return d;
  }

  function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  function normalize(idx, n) {
    return ((idx % n) + n) % n;
  }

  function drawCards(n) {
    const drawn = [];
    for (let i = 0; i < n; i++) {
      if (deck.length === 0) reshuffleDiscardIntoDeck();
      if (deck.length === 0) break;
      drawn.push(deck.pop());
    }
    return drawn;
  }

  function reshuffleDiscardIntoDeck() {
    const top = discardPile.pop();
    deck = shuffle(discardPile);
    discardPile = [top];
  }

  function isValidPlay(card, color, topCard) {
    if (card.color === 'black') return true;
    if (card.color === color) return true;
    if (card.type === topCard.type && card.type !== 'number') return true;
    if (card.type === 'number' && topCard.type === 'number' && card.value === topCard.value) return true;
    return false;
  }

  function topDiscard() {
    return discardPile[discardPile.length - 1];
  }

  function cardEl(card, faceUp) {
    const el = document.createElement('div');
    if (!faceUp) {
      el.className = 'card back';
      return el;
    }
    el.className = `card ${card.color}`;
    const oval = document.createElement('div');
    oval.className = 'oval';
    const symbol = document.createElement('div');
    symbol.className = 'symbol';
    symbol.textContent = card.type === 'number' ? card.value : SYMBOLS[card.type];
    el.appendChild(oval);
    el.appendChild(symbol);
    return el;
  }

  function renderDiscard() {
    discardCardEl.innerHTML = '';
    discardCardEl.appendChild(cardEl(topDiscard(), true));
    if (topDiscard().color === 'black') {
      discardCardEl.firstChild.style.outline = `4px solid ${currentColorHex()}`;
    }
  }

  function currentColorHex() {
    return { red: '#e53935', yellow: '#f4b400', green: '#43a047', blue: '#1e88e5' }[currentColor] || '#fff';
  }

  function renderHand() {
    handEl.innerHTML = '';
    const hand = players[currentPlayerIndex].hand;
    hand.forEach((card, i) => {
      const el = cardEl(card, true);
      const playable = !gameOver && isValidPlay(card, currentColor, topDiscard());
      if (!playable) el.classList.add('disabled');
      el.addEventListener('click', () => handleCardClick(i));
      handEl.appendChild(el);
    });
    endTurnBtn.style.display = drawnCardIdx !== null ? 'inline-block' : 'none';
  }

  function updateStatus() {
    if (gameOver) {
      statusEl.textContent = `🎉 Player ${winner + 1} wins!`;
      return;
    }
    const hand = players[currentPlayerIndex].hand;
    let msg = `Player ${currentPlayerIndex + 1}'s turn`;
    if (hand.length === 1) msg += ' — UNO! 🎉';
    statusEl.textContent = msg;
  }

  function newGame() {
    const n = getPlayerCount();
    players = Array.from({ length: n }, () => ({ hand: [] }));
    deck = shuffle(buildDeck());
    for (let i = 0; i < 7; i++) {
      players.forEach(p => p.hand.push(deck.pop()));
    }
    discardPile = [];
    let first;
    do { first = deck.pop(); if (first.type !== 'number') deck.unshift(first); }
    while (first.type !== 'number');
    discardPile.push(first);
    currentColor = first.color;
    currentPlayerIndex = 0;
    direction = 1;
    gameOver = false;
    winner = null;
    drawnCardIdx = null;
    pendingWildPlay = null;

    renderDiscard();
    showHandoff();
  }

  function showHandoff() {
    if (gameOver) {
      overlay.classList.remove('visible');
      renderHand();
      updateStatus();
      return;
    }
    overlayTitle.textContent = `Pass to Player ${currentPlayerIndex + 1}`;
    overlaySubtitle.textContent = 'Everyone look away — tap Ready when you have the device.';
    overlay.classList.add('visible');
  }

  overlayBtn.addEventListener('click', () => {
    overlay.classList.remove('visible');
    drawnCardIdx = null;
    renderHand();
    updateStatus();
  });

  function handleCardClick(i) {
    const hand = players[currentPlayerIndex].hand;
    const card = hand[i];
    if (!isValidPlay(card, currentColor, topDiscard())) return;
    if (card.color === 'black') {
      pendingWildPlay = i;
      showColorPicker();
      return;
    }
    playCard(i, card.color);
  }

  function showColorPicker() {
    overlayTitle.textContent = 'Pick a color';
    overlaySubtitle.textContent = '';
    overlayBtn.style.display = 'none';
    const picker = document.createElement('div');
    picker.id = 'colorPicker';
    COLORS.forEach(c => {
      const btn = document.createElement('button');
      btn.className = c;
      btn.addEventListener('click', () => {
        picker.remove();
        overlayBtn.style.display = 'inline-block';
        overlay.classList.remove('visible');
        playCard(pendingWildPlay, c);
        pendingWildPlay = null;
      });
      picker.appendChild(btn);
    });
    overlay.appendChild(picker);
    overlay.classList.add('visible');
  }

  function playCard(i, chosenColor) {
    const hand = players[currentPlayerIndex].hand;
    const card = hand.splice(i, 1)[0];
    discardPile.push(card);
    currentColor = card.color === 'black' ? chosenColor : card.color;
    renderDiscard();
    drawnCardIdx = null;

    if (hand.length === 0) {
      gameOver = true;
      winner = currentPlayerIndex;
      renderHand();
      updateStatus();
      return;
    }

    const fromIdx = currentPlayerIndex;
    let steps = 1;
    if (card.type === 'reverse') {
      direction *= -1;
      if (players.length === 2) steps = 2;
    } else if (card.type === 'skip') {
      steps = 2;
    } else if (card.type === 'draw2') {
      const target = normalize(fromIdx + direction, players.length);
      players[target].hand.push(...drawCards(2));
      steps = 2;
    } else if (card.type === 'wild4') {
      const target = normalize(fromIdx + direction, players.length);
      players[target].hand.push(...drawCards(4));
      steps = 2;
    }
    currentPlayerIndex = normalize(fromIdx + direction * steps, players.length);
    if (currentPlayerIndex === fromIdx) {
      // same player continues — e.g. in 2-player, a skip/reverse/draw2/wild4
      // returns the turn to the only opponent's opponent, i.e. themselves.
      // No one else needs to look away, so skip the hand-off screen entirely.
      renderHand();
      updateStatus();
    } else {
      showHandoff();
    }
  }

  drawPileEl.addEventListener('click', () => {
    if (gameOver || drawnCardIdx !== null) return;
    const [card] = drawCards(1);
    if (!card) return;
    players[currentPlayerIndex].hand.push(card);
    drawnCardIdx = players[currentPlayerIndex].hand.length - 1;
    renderHand();
  });

  endTurnBtn.addEventListener('click', () => {
    if (drawnCardIdx === null) return;
    drawnCardIdx = null;
    currentPlayerIndex = normalize(currentPlayerIndex + direction, players.length);
    showHandoff();
  });

  newGameBtn.addEventListener('click', newGame);

  // test-only hooks: safe to leave in production — reveal/manipulate only
  // today's local game state, no server data, same trust model as other
  // games' hooks
  window.__testGetState = () => ({
    players: players.map(p => ({ hand: [...p.hand] })),
    currentPlayerIndex, direction, currentColor,
    topDiscard: topDiscard(), gameOver, winner
  });
  window.__testPlayCard = (i, color) => playCard(i, color);
  window.__testDismissHandoff = () => overlayBtn.click();
  window.__testSetState = (state) => {
    players = state.players.map(p => ({ hand: [...p.hand] }));
    discardPile = [state.topDiscard];
    currentColor = state.currentColor;
    currentPlayerIndex = state.currentPlayerIndex;
    direction = state.direction;
    gameOver = false;
    winner = null;
    drawnCardIdx = null;
    overlay.classList.remove('visible');
    renderDiscard();
    renderHand();
    updateStatus();
  };

  newGame();
})();
</script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(err => console.error('SW registration failed:', err));
    });
  }
</script>
</body>
</html>
