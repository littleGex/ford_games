<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Ford House</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#16202f">
  <link rel="stylesheet" href="css/house.css">
  <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.module.js" } }
  </script>
</head>
<body>
  <canvas id="scene" aria-label="3D view of the ground floor"></canvas>

  <div class="hud top">
    <div class="chip room" aria-live="polite">
      <div class="label" id="floorName">Erdgeschoss</div>
      <div class="name" id="roomName">Vorgarten</div>
      <div class="area" id="roomArea">front garden</div>
    </div>
    <div class="chip tasks" id="taskPanel">
      <h2><button id="taskToggle" aria-expanded="true"><span id="dayLabel">Day 1</span> <b class="caret">▾</b></button><span id="taskCount">0/0</span></h2>
      <div class="next"><div id="nextTitle"></div><div id="nextStep"></div></div>
      <ul id="taskList"></ul>
      <div class="tasks-restart">
        <button class="linkbtn" id="gameRestart">Start over from day 1</button>
        <span id="gameRestartConfirm" hidden>Lose all progress?
          <button class="linkbtn danger" id="gameRestartYes">Yes, start over</button>
          <button class="linkbtn" id="gameRestartNo">No</button>
        </span>
      </div>
    </div>
  </div>

  <div class="hint" id="hint">Drag the stick to walk · keyboard: WASD, E to act</div>
  <div class="toast" id="toast" role="status"></div>
  <div class="alert" id="alert" role="status" hidden></div>

  <div class="daydone" id="dayDone" role="dialog" aria-modal="true" aria-labelledby="dayDoneTitle" hidden>
    <div class="daydone-card">
      <p class="daydone-eyebrow">Ford House</p>
      <h1 id="dayDoneTitle">Day 1 complete</h1>
      <p class="daydone-stats" id="dayDoneStats"></p>
      <div class="daydone-tomorrow">
        <h2>Tomorrow</h2>
        <ul id="dayDoneTomorrow"></ul>
      </div>
      <button class="btn daydone-next" id="dayNext">Start day 2</button>
      <p class="daydone-totals" id="dayDoneTotals"></p>
      <div class="daydone-restart">
        <button class="linkbtn" id="dayRestart">Start over from day 1</button>
        <span id="dayRestartConfirm" hidden>Lose all progress?
          <button class="linkbtn danger" id="dayRestartYes">Yes, start over</button>
          <button class="linkbtn" id="dayRestartNo">No</button>
        </span>
      </div>
    </div>
  </div>

  <div class="sort" id="sort" role="dialog" aria-modal="true" aria-labelledby="sortTitle" hidden>
    <div class="sort-card" id="sortCard">
      <p class="daydone-eyebrow">Laundry</p>
      <h1 id="sortTitle">Sort the washing</h1>
      <div class="sort-item">
        <svg viewBox="0 0 100 100" width="104" height="104" aria-hidden="true"><path id="sortShape" d="" stroke="rgba(0,0,0,.35)" stroke-width="2" stroke-linejoin="round"/></svg>
        <p class="sort-name" id="sortName"></p>
        <p class="sort-count" id="sortCount"></p>
      </div>
      <div class="sort-bins">
        <button class="sort-bin" data-bin="white"><span class="sort-swatch" style="background:#f4f4f2"></span>Whites<kbd>1</kbd></button>
        <button class="sort-bin" data-bin="colour"><span class="sort-swatch sort-swatch-mix"></span>Colours<kbd>2</kbd></button>
        <button class="sort-bin" data-bin="dark"><span class="sort-swatch" style="background:#22252c"></span>Darks<kbd>3</kbd></button>
      </div>
      <p class="sort-feedback" id="sortFeedback" role="status"></p>
      <button class="linkbtn" id="sortLater">Do it later</button>
    </div>
  </div>

  <div class="hud bottom">
    <div class="stick" id="stick" aria-label="Movement stick"><div class="knob" id="knob"></div></div>
    <div class="right">
      <div class="who" role="group" aria-label="Choose who to play">
        <button data-c="dad" aria-pressed="true">Dad</button><button data-c="mum" aria-pressed="false">Mum</button><button data-c="girl" aria-pressed="false">P</button><button data-c="boy" aria-pressed="false">Dude</button>
      </div>
      <button class="ghost" id="rotBtn" aria-label="Turn the camera">↻ Turn view</button>
      <button class="btn act" id="actBtn" hidden>Pick up</button>
    </div>
  </div>

  <script type="module" src="js/main.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(err => console.error('SW registration failed:', err));
      });
    }
  </script>
</body>
</html>
