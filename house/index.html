<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Ford House</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#16202f">
  <link rel="stylesheet" href="css/house.css">
  <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.module.js" } }
  </script>
</head>
<body>
  <canvas id="scene" aria-label="3D view of the ground floor"></canvas>

  <div class="hud top">
    <div class="chip room" aria-live="polite">
      <div class="label">Erdgeschoss</div>
      <div class="name" id="roomName">Vorgarten</div>
      <div class="area" id="roomArea">front garden</div>
    </div>
    <div class="chip tasks" id="taskPanel">
      <h2><button id="taskToggle" aria-expanded="true">Jobs <b class="caret">▾</b></button><span id="taskCount">0/0</span></h2>
      <div class="next"><div id="nextTitle"></div><div id="nextStep"></div></div>
      <ul id="taskList"></ul>
    </div>
  </div>

  <div class="hint" id="hint">Drag the stick to walk · keyboard: WASD, E to act</div>
  <div class="toast" id="toast" role="status"></div>
  <div class="alert" id="alert" role="status" hidden></div>

  <div class="hud bottom">
    <div class="stick" id="stick" aria-label="Movement stick"><div class="knob" id="knob"></div></div>
    <div class="right">
      <div class="who" role="group" aria-label="Choose who to play">
        <button data-c="dad" aria-pressed="true">Dad</button><button data-c="girl" aria-pressed="false">P</button><button data-c="boy" aria-pressed="false">Dude</button>
      </div>
      <button class="ghost" id="rotBtn" aria-label="Turn the camera">↻ Turn view</button>
      <button class="btn act" id="actBtn" hidden>Pick up</button>
    </div>
  </div>

  <script type="module" src="js/main.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(err => console.error('SW registration failed:', err));
      });
    }
  </script>
</body>
</html>
